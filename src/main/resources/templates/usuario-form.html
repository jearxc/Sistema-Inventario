<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Registrar Usuario</title>
</head>

<body>

<h1>Registrar Usuario</h1>

<form th:object="${usuario}"
      th:action="@{/usuarios/guardar}"
      method="post">

    <label>Nombres:</label>
    <input type="text" th:field="*{nombres}">

    <br><br>

    <label>Apellidos:</label>
    <input type="text" th:field="*{apellidos}">

    <br><br>

    <label>Correo:</label>
    <input type="email" th:field="*{correo}">

    <br><br>

    <label>Username:</label>
    <input type="text" th:field="*{username}">

    <br><br>

    <label>Password:</label>
    <input type="password" th:field="*{password}">

    <br><br>

    <label>Rol:</label>

    <select th:field="*{rol}">

        <option value="">
            Seleccione un rol
        </option>

        <option
                th:each="rol : ${roles}"
                th:value="${rol.id}"
                th:text="${rol.nombre}">
        </option>

    </select>




    </select>

    <br><br>

    <button type="submit">
        Guardar
    </button>

</form>

</body>
</html>
